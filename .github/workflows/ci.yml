name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Valider la syntaxe de docker-compose.yml
        run: docker compose config

      - name: Construire les images et demarrer le stack
        run: docker compose up -d --build db redpanda elasticsearch adminer kibana

      - name: Attendre que les services soient healthy
        run: |
          max_tries=30
          for service in db redpanda elasticsearch; do
            tries=0
            until [ "$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q $service))" = "healthy" ]; do
              tries=$((tries + 1))
              if [ $tries -ge $max_tries ]; then
                echo "$service n'est jamais devenu healthy"
                exit 1
              fi
              echo "En attente de $service ($tries/$max_tries)..."
              sleep 5
            done
            echo "$service est healthy"
          done

      - name: Logs en cas d'echec
        if: failure()
        run: docker compose logs

      - name: Nettoyage
        if: always()
        run: docker compose down -v
